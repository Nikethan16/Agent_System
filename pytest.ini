[pytest]
# Collect ONLY the real suite. Agent runs generate throwaway projects (each with their own
# test_*.py) under data/checkpoints/ and workspace/; without this, a bare `pytest` tries to
# collect those generated files and ERRORS during collection (they import project-specific or
# missing deps, or are half-written). testpaths keeps `pytest` == `pytest tests/`.
testpaths = tests
norecursedirs = data workspace .venv node_modules web dist build .git __pycache__ .pytest_cache .mypy_cache
