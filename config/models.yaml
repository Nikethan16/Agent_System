# ============================================================================
#  MODEL REGISTRY  —  THE ONLY PLACE YOU CHANGE MODELS.
# ============================================================================
#  Every model string here is passed straight to LiteLLM, which resolves the
#  provider from the prefix. To swap a model, edit the catalog below (cost-first
#  mode) or the tier "model:" line (fixed mode). Nothing else in the code changes.
#
#  Provider prefix examples (LiteLLM syntax):
#    anthropic ......  claude-opus-4-7            (no prefix needed)
#    openai .........  gpt-5.5  /  gpt-4o-mini
#    google .........  gemini/gemini-2.5-flash
#    nvidia nim .....  nvidia_nim/<vendor>/<model>   (free dev tier, 40 RPM/key)
#    openrouter .....  openrouter/<vendor>/<model>   (one key, any model)
#    local (ollama) .  ollama/qwen2.5-coder:32b
#
#  NOTE: model names move fast (new releases ~weekly). The NVIDIA NIM ids below
#  were verified live against https://integrate.api.nvidia.com/v1/models and
#  probed for tool-calling through litellm on 2026-06-13. If one 404s, re-list
#  the provider's current models and update here.
# ============================================================================

defaults:
  classifier_tier: tier1     # the cheap model used to ROUTE incoming tasks
  fallback_tier: tier2       # used if routing/classification fails
  # "cheapest" = auto-pick the cheapest AVAILABLE model capable of each tier (cost-first).
  # Only models whose `requires_env` key is set are considered, so adding a free
  # provider's key (NVIDIA NIM, OpenRouter :free, …) makes free models get used
  # automatically. Set to "fixed" to always use each tier's `model:` below.
  model_strategy: cheapest
  # Default input context window (tokens) for catalog models without an explicit
  # `context_window:`. Drives adaptive context packing (server/chat.py) instead of a
  # hardcoded message count. The NVIDIA fleet is >=128K; per-model overrides can be
  # added in the catalog (e.g. deepseek-v4-pro / llama-4-maverick are ~1M).
  context_window: 131072

# ---- TIERS: the difficulty levels and which model serves each. ----
# model_strategy is "cheapest" (above), so the ACTIVE model per tier is chosen
# from the CATALOG below by the cost-first selector. These `model:` lines are the
# fallback used only in "fixed" mode (or if no catalog candidate is available) —
# keep them sane, but the catalog is the real swap point.
# Primary fleet is now NVIDIA NIM (free, poolable RPM); Gemini is the fallback.
tiers:
  tier1:
    label: "Fast & cheap"
    model: "gemini/gemini-2.5-flash-lite"
    max_tokens: 1024
  tier2:
    label: "Balanced"
    model: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
    max_tokens: 4096
  tier3:
    label: "Frontier"
    model: "nvidia_nim/deepseek-ai/deepseek-v4-pro"
    max_tokens: 8192

# Which tier the orchestrator hands subtasks to (workers can be cheaper than
# the planner that created them).
worker_tier: tier2

# ---- ROUTING: explicit fallback CHAINS per task_type (primary first) --------
# Used by registry.model_chain() + core/llm.complete_chain(): if the primary model
# is rate-limited across all its keys / times out / 5xx / is dead, the run advances
# to the next model here. model_chain auto-appends deeper fallbacks after these, and
# SKIPS any model whose key isn't set — so the PAID DIRECT models below lead each
# chain but stay inert until their key lands in .env; until then every chain falls
# through to the free NIM/Gemini fleet exactly as before. (This is what the Settings
# "Routing & fallback" editor edits.)
#
# DESIGN (finalized 2026-07-11, fit -> reliability -> cost):
#   plan/lead   deepseek-v4-pro    frontier reasoning at ~5x cheaper output than GLM
#   build       deepseek-v4-flash  near-free with its automatic prompt cache (90%+ hits)
#   review/qa   GLM-4.6 (deepinfra) strong open tool-caller judges + runs the tests
#   research    nemotron (deepinfra) reliable tool-calls at ~12x below GLM cost
#   Every chain spans >=2 providers so one provider's outage never stalls a run.
# KEYS: DEEPSEEK_API_KEY + DEEPINFRA_API_KEY run the whole paid fleet (2 keys). GLM
#   comes from DeepInfra (FP4) — reliable Grade-A host, cheaper than z.ai; if the hard
#   tool-calling cases ever need z.ai's FP8 GLM, add it as a deeper fallback + ZAI key.
# EACH chain lists the paid leads FIRST, then the FULL free NIM/Gemini order — so with
#   no paid keys the chain resolves EXACTLY as it did before this change (model_chain
#   skips key-less models, then truncates), and no benchmarked free fallback is lost.
routing:
  chat:      ["deepseek/deepseek-v4-flash",
              "gemini/gemini-2.5-flash-lite",
              "nvidia_nim/nvidia/nemotron-3-nano-30b-a3b"]
  # The LEAD/planner: V4 Pro plans (reasoning fit, cheap long outputs); DeepInfra
  # Nemotron + GLM are the paid fallbacks. Free floor keeps main's curated order:
  # NIM nemotron-super, then NIM deepseek-v4-pro, then minimax (both demoted, 45s+).
  reasoning: ["deepseek/deepseek-v4-pro",
              "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b",
              "nvidia_nim/deepseek-ai/deepseek-v4-pro",
              "nvidia_nim/minimaxai/minimax-m3"]
  planning:  ["deepseek/deepseek-v4-pro",
              "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b",
              "nvidia_nim/deepseek-ai/deepseek-v4-pro",
              "nvidia_nim/minimaxai/minimax-m3"]
  # math is a reasoning-class type the router can emit — same chain as planning so a
  # math task also leads with the paid reasoner instead of falling to the free floor.
  math:      ["deepseek/deepseek-v4-pro",
              "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b",
              "nvidia_nim/deepseek-ai/deepseek-v4-pro"]
  # The BUILDER: V4-Flash direct is the community-proven build workhorse (its 0/10
  # in our 2026-06-27 benchmark was NIM timing out — a provider failure, not the
  # model; direct DeepSeek serves it reliably + cached). Qwen3-Coder + GLM back it up.
  # Free floor keeps main's order: NIM GLM-5.1 (10/10), qwen3.5-122b (9/10), nemotron.
  coding:    ["deepseek/deepseek-v4-flash",
              "deepinfra/Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo",
              "deepinfra/zai-org/GLM-5.1",
              "nvidia_nim/qwen/qwen3.5-122b-a10b",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  # frontend is coding-class but a distinct task_type (the frontend agent's capability
  # + dispatcher tag) — alias it to the coding chain so delegated UI builds get the
  # curated builder fleet, not the generic cheapest-capable pool.
  frontend:  ["deepseek/deepseek-v4-flash",
              "deepinfra/Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo",
              "deepinfra/zai-org/GLM-5.1",
              "nvidia_nim/qwen/qwen3.5-122b-a10b",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  # REVIEW/QA: short outputs, high judgment, must reliably run_bash the tests -> GLM's
  # tool-calling leads. Both the critic (capability 'qa') and code-reviewer (capability
  # 'review') route here, so 'review' is defined as an alias of this chain.
  qa:        ["deepinfra/zai-org/GLM-5.1",
              "deepseek/deepseek-v4-pro",
              "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  review:    ["deepinfra/zai-org/GLM-5.1",
              "deepseek/deepseek-v4-pro",
              "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  # RESEARCH is input-heavy with LOW cache hits (every fetch is new content), so an
  # expensive model burns money here — Nemotron-Super is a first-class tool-caller at
  # ~12x below GLM cost (validated 2026-07-11). Free floor keeps main's order: Gemini
  # Flash (reliable tool-calls), qwen3.5-122b, then NIM GLM-5.1.
  research:  ["deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B",
              "deepseek/deepseek-v4-flash",
              "gemini/gemini-2.5-flash",
              "nvidia_nim/qwen/qwen3.5-122b-a10b"]
  general:   ["deepseek/deepseek-v4-flash",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b",
              "nvidia_nim/meta/llama-4-maverick-17b-128e-instruct"]
  writing:   ["deepseek/deepseek-v4-flash",
              "deepinfra/zai-org/GLM-5.1",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  classify:  ["gemini/gemini-2.5-flash-lite",
              "nvidia_nim/nvidia/nemotron-3-nano-30b-a3b"]
  # data leads with the code-specialist; free floor keeps main's order (qwen, glm, nemotron).
  data:      ["deepinfra/Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo",
              "deepseek/deepseek-v4-flash",
              "nvidia_nim/qwen/qwen3.5-122b-a10b",
              "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"]
  vision:    ["deepinfra/Qwen/Qwen3-VL-235B-A22B-Instruct",
              "nvidia_nim/meta/llama-4-maverick-17b-128e-instruct",
              "gemini/gemini-2.5-flash"]

# PLACEHOLDER — set to enable the Image agent's generate_image tool. For Gemini use
# Imagen, e.g. "gemini/imagen-3.0-generate-002" (needs GEMINI_API_KEY). Left unset.
# image_model: "gemini/imagen-3.0-generate-002"

# Embedding-backed memory (optional): set EMBED_MODEL in .env. For Gemini:
#   EMBED_MODEL=gemini/gemini-embedding-001   (text-embedding-004 was retired/404s)

# ---- CATALOG: the pool the cost-first selector chooses from ----------------
# Fields per model:
#   requires_env : the provider key that must be set for this model to be usable
#                  (selector skips models whose key is missing) — null = no key needed
#   free         : true if free / free-tier (selector prefers these)
#   cost         : among FREE models this is a PREFERENCE RANK (lower = preferred);
#                  for paid models it's a relative price. Selector sorts free-first,
#                  then by this number — so it doubles as "which free model wins".
#   tier_hint    : 1=simple, 2=balanced, 3=frontier (must be >= the task's tier)
#   good_for     : task tags the selector prefers when they match
#   timeout_s    : per-model wall-clock timeout (seconds) for a single call; omit = the
#                  global default (AGENT_LLM_TIMEOUT, 60s). Slow frontier reasoning models
#                  take ~70s+ on the free tier, so a non-streaming call to one would be
#                  guillotined by the default — give them headroom here. (For streaming
#                  calls this bounds the per-CHUNK watchdog, so it only trips on a true stall.)
# The model-scout agent appends/updates discovered models in config/models.discovered.yaml.
catalog:
  # =========================================================================
  #  PAID DIRECT FLEET — the quality tier (finalized 2026-07-11, fit ->
  #  reliability -> cost). INERT until each provider's key is in .env; the
  #  moment a key lands, the routing chains above start using these.
  #  Keys: DEEPSEEK_API_KEY (platform.deepseek.com) · ZAI_API_KEY (z.ai) ·
  #        DEEPINFRA_API_KEY (deepinfra.com).
  #  NOTE: the exact LiteLLM ids below must be VERIFIED on first use (one
  #  cheap smoke call per model when the key arrives) — provider catalogs
  #  rename models within weeks. cost = relative price rank, NOT a dollar
  #  figure (prices live with the provider, not in this repo).
  # =========================================================================

  # Build workhorse: near-free in agentic loops thanks to DeepSeek's AUTOMATIC
  # prompt cache (cache-hit input ~98% off; our loop keeps a stable prefix).
  # Call DIRECT, not via a router/aggregator — multi-backend routing breaks
  # prefix stability and cuts cache hits 2-3x.
  - id: "deepseek/deepseek-v4-flash"
    provider: "deepseek"
    requires_env: "DEEPSEEK_API_KEY"
    free: false
    open_source: false
    cost: 7
    tier_hint: 3
    timeout_s: 90
    good_for: [coding, general, chat, writing, summarize, agentic]

  # Planner/lead: frontier-class reasoning at a fraction of GLM's output price.
  # Known weakness: structured tool-calls (why qa/coding don't lead with it).
  - id: "deepseek/deepseek-v4-pro"
    provider: "deepseek"
    requires_env: "DEEPSEEK_API_KEY"
    free: false
    open_source: false
    cost: 8
    tier_hint: 3
    timeout_s: 120
    good_for: [reasoning, planning, agents, hard, math]

  # Review/QA + coding fallback: the strongest open-model tool-caller, from DeepInfra
  # (Grade-A host, FP4 — cheaper than z.ai's FP8 reference; A/B on evals will show if the
  # hard tool-calling cases need FP8, in which case add a zai/ entry as a deeper fallback).
  # good_for covers review/qa AND frontend so the frontend agent's delegations prefer it.
  - id: "deepinfra/zai-org/GLM-4.6"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 9
    tier_hint: 3
    timeout_s: 90
    good_for: [qa, review, coding, agentic, frontend, debugging, writing]
  # GLM 5.1 / 5.2 — newer generations (DeepInfra hosts both). Catalogued so they're
  # selectable for the A/B bake-off; the winner becomes the review/coding GLM primary.
  - id: "deepinfra/zai-org/GLM-5.1"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 10
    tier_hint: 3
    timeout_s: 120
    good_for: [qa, review, coding, agentic, frontend, debugging, writing]
  - id: "deepinfra/zai-org/GLM-5.2"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 11
    tier_hint: 3
    timeout_s: 120
    good_for: [qa, review, coding, agentic, frontend, debugging, writing]

  # Research lead: first-class tool-caller (our benchmark: 10/10) at a low
  # price — research is input-heavy with low cache hits, so cheap+reliable
  # beats premium here. DeepInfra = Grade-A SLA, one key, many families.
  - id: "deepinfra/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 7
    tier_hint: 3
    timeout_s: 90
    good_for: [research, web, reasoning, analysis, hard]

  # Data analysis: code-specialized (pandas/scripts) — "code that computes".
  - id: "deepinfra/Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 8
    tier_hint: 3
    timeout_s: 90
    good_for: [data, coding, analysis, scripts]
    sampling: { temperature: 0.55, top_p: 0.95, repeat_penalty: 1.1 }

  # Vision: cheapest reliable VLM that also tool-calls.
  - id: "deepinfra/Qwen/Qwen3-VL-235B-A22B-Instruct"
    provider: "deepinfra"
    requires_env: "DEEPINFRA_API_KEY"
    free: false
    open_source: true
    cost: 7
    tier_hint: 2
    good_for: [vision]

  # PRIVACY NOTE (research 2026-07): DeepSeek (opt-out) and z.ai (explicit
  # no-training policy) are the safe picks for proprietary code. Do NOT add
  # MiniMax or Xiaomi/MiMo direct APIs for private work — neither guarantees
  # zero retention.

  # =========================================================================
  #  NVIDIA NIM FLEET — the FREE fleet (40 RPM per key; needs
  #  NVIDIA_NIM_API_KEY) — now the fallback floor under the paid directs.
  #  All ids verified live + tool-calling probed 2026-06-13.
  # =========================================================================

  # --- Orchestrator / LEAD (reasoning, planning, agent loops) ---
  # cost demoted 0 -> 4: it was the cost-first DEFAULT pick (cheapest + first in
  # catalog) for every bare tier lookup, but it times out frequently on the NIM
  # free tier. Demoting keeps it usable as a fallback without it poisoning the
  # default/greeting path. Drop back to 0 to restore it as the primary.
  - id: "nvidia_nim/deepseek-ai/deepseek-v4-pro"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: false          # open-weight status disputed — verify before self-host
    cost: 4
    tier_hint: 3
    timeout_s: 120          # ~70s/call on the free tier (probe 2026-06-22) — needs >45s default
    good_for: [reasoning, planning, agents, hard, math]

  # REMOVED 2026-07-12 (verified dead via scripts.verify_models): NVIDIA retired both
  #   nvidia_nim/z-ai/glm-5.1 (HTTP 410 Gone) and nvidia_nim/deepseek-ai/deepseek-v4-flash
  #   (HTTP 404). The GLM was cost 0 so the cost-first picker was *selecting* it as the
  #   tier-1/tier-2 default and it 410'd on every call; both were also hit as fallbacks in
  #   the routing chains (wasted call + latency). GLM's free-floor role in the chains is now
  #   covered by nemotron-super / qwen3.5; the paid deepinfra GLM-5.1 leads the code chains.

  # --- Long-context research (tool-calling verified) ---
  - id: "nvidia_nim/qwen/qwen3.5-122b-a10b"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 0
    tier_hint: 3
    good_for: [research, analysis, web]
    # Qwen loops/repeats at temp 0; Qwen team + Unsloth recommend temp ~0.55 + a small
    # repeat penalty. LiteLLM forwards what the provider supports, drops the rest.
    sampling: { temperature: 0.55, top_p: 0.95, repeat_penalty: 1.1 }

  # --- Reasoning alternates / fallbacks ---
  - id: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 1
    tier_hint: 3
    timeout_s: 120          # ~70s/call, streams smoothly (probe 2026-06-22)
    good_for: [reasoning, hard, math]
  - id: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 2
    tier_hint: 3
    timeout_s: 120          # 550B frontier — slow on the free tier, give it headroom
    good_for: [reasoning, hard]

  # --- General / multimodal-doc alternate ---
  - id: "nvidia_nim/meta/llama-4-maverick-17b-128e-instruct"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 1
    tier_hint: 2
    good_for: [general, analysis, writing, vision]

  # --- Fast router / classifier alternate (tier 1) ---
  - id: "nvidia_nim/nvidia/nemotron-3-nano-30b-a3b"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 1
    tier_hint: 1
    good_for: [routing, classify, chat, simple, summarize]

  # --- Deeper bench (tool-calling verified live 2026-06-13; kept as fallbacks
  #     behind the cost-0 primaries above). (codestral-22b was listed by NIM but
  #     404s on the completion endpoint, so it is intentionally NOT included.) ---
  - id: "nvidia_nim/minimaxai/minimax-m3"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 2
    tier_hint: 3
    context_window: 1000000
    timeout_s: 90           # ~230s total but streams (44s max gap, probe 2026-06-22): per-chunk
                            # watchdog tolerates its gaps; demoted fallback, so cap the wait.
    good_for: [planning, reasoning, longcontext, architecture]
  - id: "nvidia_nim/qwen/qwen3.5-397b-a17b"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 2
    tier_hint: 3
    timeout_s: 120          # 397B frontier — slow on the free tier
    good_for: [reasoning, research, analysis, hard]
    sampling: { temperature: 0.55, top_p: 0.95, repeat_penalty: 1.1 }
  - id: "nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 3
    tier_hint: 3
    timeout_s: 120          # 675B frontier — slow on the free tier
    good_for: [general, reasoning, writing]

  # NOTE: moonshotai/kimi-k2.6 IS available on NIM and is multimodal, but its
  # tool-calling came back BROKEN through litellm on 2026-06-13 (garbled output).
  # Intentionally NOT listed for tool-using roles until that path is fixed.

  # --- Prior NVIDIA entries (kept as deeper fallbacks; demoted by cost) ---
  - id: "nvidia_nim/meta/llama-3.3-70b-instruct"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 3
    tier_hint: 2
    good_for: [coding, writing, general]
  - id: "nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5"
    provider: "nvidia_nim"
    requires_env: "NVIDIA_NIM_API_KEY"
    free: true
    open_source: true
    cost: 3
    tier_hint: 3
    good_for: [reasoning, coding, hard, math]

  # =========================================================================
  #  GOOGLE GEMINI — kept as the cross-provider fallback (needs GEMINI_API_KEY).
  #  Demoted by cost so the NIM fleet is preferred, but still selectable and a
  #  valuable DIFFERENT-provider fallback if NIM is rate-limited or down.
  #  (Flash-Lite stays cost 0 at tier 1 = the reliable JSON classifier for now.)
  # =========================================================================
  - id: "gemini/gemini-2.5-flash-lite"
    provider: "google"
    requires_env: "GEMINI_API_KEY"
    free: true
    cost: 0
    tier_hint: 1
    good_for: [routing, summarize, chat, simple, classify]
  - id: "gemini/gemini-2.5-flash"
    provider: "google"
    requires_env: "GEMINI_API_KEY"
    free: true
    cost: 4
    tier_hint: 2
    good_for: [writing, analysis, coding, general, research]
  - id: "gemini/gemini-2.5-pro"
    provider: "google"
    requires_env: "GEMINI_API_KEY"
    free: false
    cost: 6
    tier_hint: 3
    good_for: [reasoning, architecture, hard, planning]

  # --- OpenRouter free variants (inert unless OPENROUTER_API_KEY is set) ---
  - id: "openrouter/deepseek/deepseek-r1:free"
    provider: "openrouter"
    requires_env: "OPENROUTER_API_KEY"
    free: true
    open_source: true
    cost: 5
    tier_hint: 3
    good_for: [reasoning, coding, hard]
  - id: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
    provider: "openrouter"
    requires_env: "OPENROUTER_API_KEY"
    free: true
    open_source: true
    cost: 5
    tier_hint: 2
    good_for: [writing, general, coding]

  # --- Local Ollama (inert unless USE_OLLAMA=1) ---
  - id: "ollama/llama3.1:8b"
    provider: "local"
    requires_env: "USE_OLLAMA"
    free: true
    open_source: true
    cost: 5
    tier_hint: 1
    good_for: [simple, chat, summarize]
