# ============================================================================
#  EVAL CASES — the fixed task set used to verify a model swap didn't regress.
# ============================================================================
#  Add a case by appending to `cases:` — no code change needed. Each case runs
#  through the real pipeline; it PASSES only if EVERY grader passes (concrete
#  yes/no, never a 1-10 score).
#
#  Grader types (see evals/graders.py):
#    contains      {any: [...]} and/or {all: [...]}   substrings in the answer
#    not_contains  {any: [...]} / {all: [...]}         must be ABSENT
#    regex         {pattern: "...", ignorecase: true}
#    file_exists   {path: "x.py", non_empty: true}     a file in the workspace
#    file_contains {path: "x.py", all: [...]}          file holds these strings
#    bash_check    {command: "...", expect_exit: 0}    runs it; checks exit code
#    llm_judge     {criteria: "..."}                   strict pass/fail by a model
#  expect_tier (optional, per case) also asserts the router chose that tier,
#  so a swap that changes routing behavior is caught too.
# ============================================================================

suite:
  max_usd: 2.0          # whole-suite spend ceiling (hard safety brake)
  pass_threshold: 1.0   # fraction of cases that must pass for exit code 0

cases:
  - id: summarize-basic
    task: >
      Summarize the following in one short sentence:
      "The mitochondria is the powerhouse of the cell; it produces most of the
      cell's supply of ATP, the molecule used as a source of chemical energy."
    budget: { max_usd: 0.05, max_iterations: 4 }
    expect_tier: 1
    graders:
      - { type: contains, any: ["cell", "energy", "atp", "mitochondri", "power"] }
      - { type: not_contains, all: ["error", "i cannot", "as an ai"] }

  - id: write-and-run-script
    task: >
      Create a file named add.py in the workspace. It must define a function
      add(a, b) that returns a + b, and include a self-check block that runs
      assert add(2, 3) == 5 when the file is executed. Make sure running
      `python add.py` exits with code 0 and prints nothing on failure.
    budget: { max_usd: 0.50, max_iterations: 8 }
    expect_tier: 2
    graders:
      - { type: file_exists, path: add.py }
      - { type: file_contains, path: add.py, all: ["def add"] }
      - { type: bash_check, command: "python add.py", expect_exit: 0 }

  - id: research-prose
    task: >
      In two or three sentences, explain why an AI system might route incoming
      tasks into difficulty tiers and use cheaper models for easy tasks.
    budget: { max_usd: 0.20, max_iterations: 6 }
    graders:
      - type: llm_judge
        criteria: >
          The answer must explain a cost-versus-quality (or cost-versus-capability)
          trade-off — i.e. cheaper/smaller models for easy work and stronger/more
          expensive models for hard work — and read as coherent prose.

  - id: architect-design
    task: >
      Produce a short technical design for a URL-shortener service: list the key
      requirements, the main components, and an ordered build plan.
    budget: { max_usd: 0.50, max_iterations: 12 }
    graders:
      - { type: contains, any: ["requirement", "component", "plan", "step", "design"] }
      - { type: not_contains, all: ["as an ai", "i cannot"] }

  - id: data-compute
    task: >
      Compute and state clearly both the sum and the average of these numbers:
      4, 8, 15, 16, 23, 42.
    budget: { max_usd: 0.40, max_iterations: 8 }
    graders:
      - { type: contains, all: ["108"] }
      - { type: contains, any: ["18", "average", "mean", "avg"] }

  # ---- Harder build/tool cases (added 2026-07-11 for the model/prompt A/B) ----
  # These exercise the tool-critical paths where the paid fleet is meant to shine:
  # multi-file build + real test execution, bug-fix-and-verify, and compute-with-code.
  # A weaker planner/prompt shows up here as a failing bash_check, not a vibe.

  - id: build-cli-with-tests
    task: >
      In the workspace build a tiny CLI calculator: calc.py exposes add, sub, mul,
      div functions and a main() that reads "<a> <op> <b>" from argv and prints the
      result. Also write test_calc.py — a pytest suite covering all four ops plus
      division-by-zero raising ValueError. Run the tests with pytest and make sure
      they all pass; fix anything that fails.
    budget: { max_usd: 0.80, max_iterations: 22 }
    expect_tier: 3
    graders:
      - { type: file_exists, path: calc.py }
      - { type: file_exists, path: test_calc.py }
      - { type: file_contains, path: calc.py, all: ["def add", "def div"] }
      - { type: bash_check, command: "python -m pytest test_calc.py -q", expect_exit: 0 }

  - id: fix-broken-function
    task: >
      A file buggy.py in the workspace defines factorial(n) but returns the wrong
      value for n = 0 (it returns 0; it should return 1). Read the file, fix the
      bug with a precise edit, and verify by running
      `python -c "import buggy; assert buggy.factorial(0)==1 and buggy.factorial(5)==120; print('ok')"`.
    budget: { max_usd: 0.60, max_iterations: 16 }
    expect_tier: 3
    setup:
      files:
        buggy.py: |
          def factorial(n):
              if n == 0:
                  return 0
              result = 1
              for i in range(1, n + 1):
                  result *= i
              return result
    graders:
      - { type: file_contains, path: buggy.py, all: ["return 1"] }
      - { type: bash_check, command: "python -c \"import buggy; assert buggy.factorial(0)==1 and buggy.factorial(5)==120; print('ok')\"", expect_exit: 0 }

  - id: compute-with-code
    task: >
      Using the workspace, compute the standard deviation (population) of the
      numbers 2, 4, 4, 4, 5, 5, 7, 9 by writing and RUNNING a short Python script,
      then state the numeric result. Do not estimate — run code and report what it
      printed.
    budget: { max_usd: 0.60, max_iterations: 14 }
    expect_tier: 3
    graders:
      - { type: contains, any: ["2.0", "2.00", " 2 "] }
      - { type: not_contains, all: ["as an ai", "i cannot", "unverified"] }
