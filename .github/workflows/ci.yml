name: CI

# Runs the offline regression suite on every push/PR. No provider keys, no cost:
# the smoke test uses a fake model and the eval harness runs in --dry-run mode.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (smoke + evals, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test (offline, fake model)
        run: python scripts/smoke_test.py
      - name: Eval harness (dry-run, offline)
        run: python -m evals --dry-run

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install + build (tsc strict + vite)
        run: |
          npm --prefix web ci
          npm --prefix web run build
